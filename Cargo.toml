[package]
name = "fila-impressao"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Painel na bandeja do Windows para ver e limpar a fila de impressão"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-single-instance = "2"
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
strip = true
